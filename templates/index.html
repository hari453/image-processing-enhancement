<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Processing & Enhancement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <main class="app-shell">
    <section class="workspace">
      <div class="panel controls-panel">
        <div class="brand">
          <span class="brand-mark">IP</span>
          <div>
            <p class="eyebrow">Flask image lab</p>
            <h1>Image Processing & Enhancement</h1>
          </div>
        </div>

        <form id="imageForm" class="tool-form">
          <label class="upload-box" for="imageInput">
            <input id="imageInput" name="image" type="file" accept="image/png,image/jpeg,image/webp" required>
            <span class="upload-icon">+</span>
            <span class="upload-title">Upload image</span>
            <span class="upload-copy">PNG, JPG, JPEG, or WEBP up to 8 MB</span>
          </label>

          <div class="field">
            <label for="operation">Operation</label>
            <select id="operation" name="operation">
              <option value="enhance">Enhance only</option>
              <option value="grayscale">Grayscale</option>
              <option value="invert">Invert colors</option>
              <option value="edges">Edge detection</option>
              <option value="emboss">Emboss</option>
            </select>
          </div>

          <div class="sliders">
            <label>Brightness <span id="brightnessValue">1.00</span></label>
            <input type="range" name="brightness" id="brightness" min="0.2" max="2.5" step="0.05" value="1">

            <label>Contrast <span id="contrastValue">1.00</span></label>
            <input type="range" name="contrast" id="contrast" min="0.2" max="2.5" step="0.05" value="1">

            <label>Sharpness <span id="sharpnessValue">1.00</span></label>
            <input type="range" name="sharpness" id="sharpness" min="0" max="3" step="0.05" value="1">

            <label>Saturation <span id="saturationValue">1.00</span></label>
            <input type="range" name="saturation" id="saturation" min="0" max="2.5" step="0.05" value="1">

            <label>Blur <span id="blurValue">0.00</span></label>
            <input type="range" name="blur" id="blur" min="0" max="8" step="0.25" value="0">
          </div>

          <button id="processButton" type="submit">Process Image</button>
          <a id="downloadButton" class="download-button hidden" href="#" download>Download Result</a>
          <p id="message" class="message" aria-live="polite"></p>
        </form>
      </div>

      <div class="preview-area">
        <section class="preview-card">
          <div class="preview-header">
            <h2>Original</h2>
            <span id="fileName">No file selected</span>
          </div>
          <div class="image-frame">
            <img id="originalPreview" alt="Original preview">
            <p class="empty-state">Your uploaded image will appear here.</p>
          </div>
        </section>

        <section class="preview-card">
          <div class="preview-header">
            <h2>Processed</h2>
            <span id="statusLabel">Waiting</span>
          </div>
          <div class="image-frame">
            <img id="processedPreview" alt="Processed preview">
            <p class="empty-state">Processed result will appear here.</p>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
